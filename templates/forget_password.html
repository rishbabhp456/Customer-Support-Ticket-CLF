<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Support Desk AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="glass-panel p-5" style="width: 28rem;">
        <h3 class="text-center mb-4 fw-bold" style="color: #0f172a;">Reset Password</h3>
        <form id="forgotForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control bg-light" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control bg-light" id="email" name="email" required>
            </div>
            <div class="mb-4">
                <label for="new_password" class="form-label fw-semibold">New Password</label>
                <input type="password" class="form-control bg-light" id="new_password" name="new_password" required>
            </div>
            <button type="submit" class="btn btn-action w-100 py-2 fs-5">Update Password</button>
        </form>
        <div class="text-center mt-4">
            <a href="/login_page" class="text-decoration-none fw-bold" style="color: #4f46e5;">Back to Login</a>
        </div>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            try {
                let response = await fetch('/forget_password', { method: 'POST', body: formData });
                let result = await response.json();
                alert(result.message);
                if (result.status === 'success') {
                    window.location.href = '/login_page';
                }
            } catch (error) {
                alert("Error connecting to server.");
            }
        });
    </script>
</body>
</html>
