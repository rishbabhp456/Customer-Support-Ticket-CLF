<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Support Desk AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="glass-panel p-5" style="width: 28rem;">
        <h3 class="text-center mb-4 fw-bold" style="color: #0f172a;">Agent Login</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control bg-light" id="username" name="username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control bg-light" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-action w-100 py-2 fs-5">Login</button>
        </form>
        <div class="text-center mt-4">
            <a href="/register_page" class="text-decoration-none fw-bold" style="color: #4f46e5;">Create an account</a> | 
            <a href="/forgot_password_page" class="text-decoration-none text-muted">Forgot Password?</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            let formData = new FormData(this);
            try {
                let response = await fetch('/login', { method: 'POST', body: formData });
                let result = await response.json();
                if (result.status === 'success') {
                    localStorage.setItem('username', formData.get('username'));
                    localStorage.setItem('access_token', result.access_token);
                    window.location.href = '/dashboard_page';
                } else {
                    alert("Login Failed: " + result.message);
                }
            } catch (error) {
                alert("Error connecting to server.");
            }
        });
    </script>
</body>
</html>
