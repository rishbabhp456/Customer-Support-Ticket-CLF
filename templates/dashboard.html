<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Desk AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .container-custom { max-width: 1000px; margin: auto; }
        .text-snippet { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; color: #555; font-size: 0.95rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom shadow-sm p-3">
    <div class="container-fluid container-custom">
        <a class="navbar-brand fw-bold fs-4" href="#">💬 Support Desk AI</a>
        <div>
            <span class="text-light me-3">Agent: <span id="displayUsername" class="fw-bold text-info"></span></span>
            <a href="#" id="logoutBtn" class="btn btn-outline-light btn-sm">Log Out</a>
        </div>
    </div>
</nav>

<div class="container container-custom mt-5">
    
    <!-- Top Stats Row -->
    <div class="glass-panel mb-4">
        <h5 class="fw-bold mb-3">Live Analytics</h5>
        <div class="row" id="categoryStatsRow">
            <div class="col-md-3 mb-2">
                <div class="stat-box">
                    <h6 class="text-uppercase mb-1" style="opacity: 0.8;">Total Tickets</h6>
                    <h3 id="statTotal" class="mb-0 fw-bold">0</h3>
                </div>
            </div>
            <!-- Dynamic categories inject here -->
        </div>
    </div>

    <!-- Central Workspace -->
    <div class="glass-panel mb-4">
        <h4 class="fw-bold mb-3 border-bottom pb-2">Classify Customer Message</h4>
        <form id="uploadForm">
            <input type="hidden" name="username" value="" id="currentUsername"> 
            <textarea class="form-control mb-3" name="text" rows="5" placeholder="Enter customer email or chat transcript..." required style="background: rgba(255,255,255,0.9);"></textarea>
            <button type="submit" class="btn btn-action w-100 py-2 fs-5" id="predictBtn">Run AI Classification</button>
        </form>

    <div id="resultBox" class="alert mt-4 d-none">
        <h5 class="mb-1 text-dark">Category: <span id="predictionText" class="fw-bold text-primary text-uppercase"></span></h5>
        <small class="text-muted">
            Priority: <span id="priorityText" class="fw-bold text-danger"></span> | 
            AI Confidence Score: <span id="confidenceText" class="fw-bold"></span>%
        </small>
    </div>
    </div>

    <!-- Bottom History Area -->
    <div class="glass-panel mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
            <h5 class="fw-bold mb-0">Recent Classifications</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="loadHistory(); loadAnalytics();">Refresh List</button>
        </div>
        <div id="historyList">
            <div class="text-center text-muted mt-3">No history loaded.</div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let storedUsername = localStorage.getItem('username');
        if (!storedUsername) { window.location.href = '/login_page'; } 
        else {
            document.getElementById('currentUsername').value = storedUsername;
            document.getElementById('displayUsername').innerText = storedUsername;
            loadHistory();
            loadAnalytics();
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', async function(e) {
        e.preventDefault();
        localStorage.clear();
        await fetch('/logout', { method: 'POST' });
        window.location.href = '/login_page';
    });

    async function loadAnalytics() {
        let username = document.getElementById('currentUsername').value;
        try {
            let response = await fetch(`/analytics?username=${username}`, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') }
            });
            let result = await response.json();
            if (result.status === 'success') {
                document.getElementById('statTotal').innerText = result.total_tickets;
                let catRow = document.getElementById('categoryStatsRow');
                catRow.innerHTML = `
                <div class="col-md-3 mb-2">
                    <div class="stat-box">
                        <h6 class="text-uppercase mb-1" style="opacity: 0.8;">Total Tickets</h6>
                        <h3 id="statTotal" class="mb-0 fw-bold">${result.total_tickets}</h3>
                    </div>
                </div>`;
                for (const [category, count] of Object.entries(result.category_breakdown)) {
                    catRow.innerHTML += `
                    <div class="col-md-3 mb-2">
                        <div class="stat-box" style="background: linear-gradient(135deg, #0f172a 0%, #334155 100%);">
                            <h6 class="text-uppercase mb-1" style="opacity: 0.8;">${category}</h6>
                            <h3 class="mb-0 fw-bold">${count}</h3>
                        </div>
                    </div>`;
                }
            }
        } catch (error) {}
    }

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        let btn = document.getElementById('predictBtn');
        btn.innerText = 'Processing...'; btn.disabled = true;
        
        try {
            let response = await fetch('/predict_ticket', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') },
                body: new FormData(this)
            });
            let result = await response.json();
            
            if(result.status === 'success') {
                let resultBox = document.getElementById('resultBox');
                resultBox.classList.remove('d-none', 'alert-success', 'alert-info');
                resultBox.classList.add('alert-success'); 
                
                document.getElementById('predictionText').innerText = result.predicted_category;
                document.getElementById('confidenceText').innerText = result.confidence;
                document.getElementById('priorityText').innerText = result.priority;
                
                loadHistory(); loadAnalytics();
            } else { alert("Error: " + result.message); }
        } catch (error) { alert("API connection failed!"); }
        
        btn.innerText = 'Run AI Classification'; btn.disabled = false;
    });

    async function loadHistory() {
        let username = document.getElementById('currentUsername').value;
        let list = document.getElementById('historyList');
        try {
            let response = await fetch(`/saved_data?username=${username}`, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') }
            });
            let result = await response.json();

            if (result.status === 'success' && result.history.length > 0) {
                list.innerHTML = "";
                result.history.reverse().forEach(item => {
                    list.innerHTML += `
                    <div class="ticket-card p-3 shadow-sm border-0 border-start border-5 border-primary">
                        <div class="d-flex align-items-center mb-2">
                            <span class="badge bg-primary fs-6">${item.predicted_category}</span>
                            <span class="badge bg-danger ms-2">${item.priority || 'Medium'}</span>
                            <small class="text-muted ms-auto">${item.date} | Confidence: ${item.confidence}%</small>
                        </div>
                        <span class="text-snippet border bg-light p-2 rounded">"${item.ticket_text}"</span>
                    </div>`;
                });
            } else { list.innerHTML = `<div class="text-center text-muted">No tickets found.</div>`; }
        } catch (error) { list.innerHTML = `<div class="text-center text-danger">Failed to load records.</div>`; }
    }
</script>
</body>
</html>
